<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/NEXUS/nexus-icon-512.png">
<title>NEXUS — Connexion</title>
<link rel="stylesheet" href="static/style.css">
<script src="maintenance.js"></script>
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">NEXUS</a>

    <nav class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="inscription.html">Créer un compte</a>
    </nav>
</header>

<main>
<section class="hero">

<div class="hero-content">

<span class="code-label">NEXUS // LOGIN</span>

<h1>Connexion.</h1>

<p class="hero-text">
    Connecte-toi pour accéder à ton espace NEXUS.
</p>

<form id="loginForm">

<div class="feature-card">

<input
    id="email"
    type="email"
    placeholder="Adresse e-mail"
    autocomplete="email"
    required
    style="width:100%;box-sizing:border-box;margin:10px 0;padding:14px;background:#111;border:1px solid #333;color:inherit;">

<input
    id="password"
    type="password"
    placeholder="Mot de passe"
    autocomplete="current-password"
    required
    style="width:100%;box-sizing:border-box;margin:10px 0;padding:14px;background:#111;border:1px solid #333;color:inherit;">

<button type="submit" class="btn btn-primary">
    Se connecter
</button>

<p id="message"></p>

<p style="margin-top:15px;">
    <a href="mot_de_passe_oublie.html">Mot de passe oublié ?</a>
</p>

</div>

</form>

<div class="hero-buttons">
    <a href="inscription.html" class="btn auth-back">
        Créer un compte
    </a>
</div>

</div>

<div class="hero-card">

<div class="terminal-top">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="terminal-content">
    <p class="terminal-green">&gt; NEXUS LOGIN</p>
    <p>Authentification...</p>
    <p class="terminal-green">&gt; SECURE ACCESS_</p>
    <div class="terminal-cursor"></div>
</div>

</div>

</section>
</main>

<footer>
© 2026 NEXUS — Tous droits réservés.
</footer>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password = document
        .getElementById("password")
        .value;

    const stored = localStorage.getItem("nexusAccount");

    if (!stored) {
        message.textContent = "Aucun compte NEXUS local trouvé.";
        return;
    }

    let account;

    try {
        account = JSON.parse(stored);
    } catch {
        message.textContent = "Compte NEXUS invalide.";
        return;
    }

    if (
        account.email !== email ||
        account.password !== password
    ) {
        message.textContent = "Adresse e-mail ou mot de passe incorrect.";
        return;
    }

    localStorage.setItem("nexusLoggedIn", "true");

    window.location.href = "compte.html";
});

</script>

</body>
</html>
