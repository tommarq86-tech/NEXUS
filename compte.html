<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/NEXUS/nexus-icon-512.png">
<title>NEXUS — Espace NEXUS</title>
<link rel="stylesheet" href="static/style.css">
<script src="maintenance.js"></script>
</head>

<body>

<header class="navbar">

<a href="index.html" class="logo">NEXUS</a>

<nav class="nav-links">
    <a href="app.html">NEXUS Web</a>
    <a href="telechargement.html">NEXUS Windows</a>
    <a href="compte.html">Mon compte</a>
</nav>

</header>

<main>

<section class="hero">

<div class="hero-content">

<span class="code-label">NEXUS // PRIVATE SPACE</span>

<h1 id="welcome">Espace NEXUS.</h1>

<p class="hero-text">
Bienvenue dans ton espace personnel.
</p>

<div class="feature-grid">

<article class="feature-card">

<h3>Comptes connectés</h3>

<div id="accountsList"></div>

<a href="connexion.html" class="btn btn-primary">
Ajouter un autre compte
</a>

</article>

</div>

</div>

<div class="hero-card">

<div class="terminal-top">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="terminal-content">

<p class="terminal-green">
&gt; NEXUS ACCESS
</p>

<p id="terminalUser">
Chargement du profil...
</p>

<p class="terminal-green">
&gt; ACCESS GRANTED
</p>

<div class="terminal-cursor"></div>

</div>

</div>

</section>

</main>

<footer>
© 2026 NEXUS — Tous droits réservés.
</footer>

<script>

const loggedIn = localStorage.getItem("nexusLoggedIn");

let accounts = [];
try {
    accounts = JSON.parse(localStorage.getItem("nexusAccounts")) || [];
} catch (e) {
    accounts = [];
}

let current = null;
try {
    current = JSON.parse(localStorage.getItem("nexusAccount"));
} catch (e) {
    current = null;
}

if (!current || loggedIn !== "true") {

    window.location.replace("connexion.html");

} else {

    if (!accounts.some(function(a) { return a.email === current.email; })) {
        accounts.push(current);
        localStorage.setItem("nexusAccounts", JSON.stringify(accounts));
    }

    const list = document.getElementById("accountsList");

    accounts.forEach(function(a) {
        const p = document.createElement("p");
        p.textContent = a.username + " — " + a.email + (a.email === current.email ? " (actif)" : "");
        list.appendChild(p);
    });

    document.getElementById("terminalUser").textContent = "Utilisateur : " + current.username;
}

</script>

</body>
</html>
