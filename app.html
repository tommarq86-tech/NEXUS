<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020712">
<meta name="description" content="NEXUS Web - assistant intelligent">
<link rel="icon" type="image/png" href="nexus-icon-512.png">
<title>NEXUS Web</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020712;
    color: #dff7ff;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 48%, rgba(0, 119, 255, .16), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(0, 204, 255, .07), transparent 48%),
        #020712;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(0, 180, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, .025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
}

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
    border-bottom: 1px solid rgba(0, 174, 255, .25);
    background: rgba(2, 7, 18, .72);
    backdrop-filter: blur(14px);
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0, 174, 255, .75));
}

.brand-name {
    font-size: 27px;
    letter-spacing: 8px;
    font-weight: 300;
}

.brand-sub {
    color: #5dbde8;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 4px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #70dfff;
    font-size: 12px;
    letter-spacing: 2px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00d9ff;
    box-shadow: 0 0 14px #00d9ff;
}

.main {
    position: fixed;
    inset: 92px 0 74px 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.voice-zone {
    position: relative;
    width: min(72vw, 720px);
    height: min(72vw, 720px);
    max-height: 720px;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.core {
    position: relative;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
        width .55s ease,
        height .55s ease,
        transform .55s ease;
    z-index: 5;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    inset: -28px;
    border-radius: 50%;
    border: 1px solid rgba(0, 183, 255, .4);
    box-shadow:
        0 0 25px rgba(0, 153, 255, .28),
        inset 0 0 25px rgba(0, 153, 255, .18);
}

.core::after {
    inset: -62px;
    border-color: rgba(0, 153, 255, .17);
}

.core.speaking {
    width: 440px;
    height: 440px;
    transform: scale(1.02);
}

.core.speaking::before {
    animation: pulseRing 1.05s infinite ease-in-out;
}

.core.speaking::after {
    animation: pulseRing 1.4s infinite ease-in-out reverse;
}

@keyframes pulseRing {
    0%, 100% {
        transform: scale(.94);
        opacity: .35;
    }
    50% {
        transform: scale(1.08);
        opacity: .9;
    }
}

.orbit {
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #00c8ff;
    border-bottom-color: rgba(0, 129, 255, .5);
}

.orbit.one {
    inset: -8px;
    animation: rotate 8s linear infinite;
}

.orbit.two {
    inset: -32px;
    border-left-color: rgba(0, 200, 255, .75);
    border-right-color: rgba(0, 200, 255, .35);
    animation: rotateReverse 13s linear infinite;
}

.orbit.three {
    inset: -54px;
    border-top-color: rgba(0, 150, 255, .35);
    border-left-color: rgba(0, 200, 255, .5);
    animation: rotate 18s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    to { transform: rotate(-360deg); }
}

.core-face {
    width: 238px;
    height: 238px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle, rgba(0, 128, 255, .3), rgba(1, 9, 22, .96) 68%);
    border: 1px solid rgba(0, 205, 255, .8);
    box-shadow:
        0 0 35px rgba(0, 157, 255, .42),
        inset 0 0 35px rgba(0, 119, 255, .2);
}

.core-face img {
    width: 88px;
    height: 88px;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(0, 195, 255, .9));
    margin-bottom: 8px;
}

.nexus-title {
    font-size: 25px;
    letter-spacing: 8px;
    font-weight: 300;
}

.nexus-state {
    margin-top: 13px;
    color: #64cceb;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.talk-button {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    border: 1px solid rgba(0, 207, 255, .75);
    background: rgba(2, 17, 36, .9);
    color: #c9f7ff;
    padding: 14px 27px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(0, 172, 255, .2);
    transition: .25s ease;
}

.talk-button:hover {
    background: rgba(0, 116, 194, .28);
    box-shadow: 0 0 30px rgba(0, 193, 255, .45);
}

.talk-button.active {
    background: rgba(0, 152, 255, .25);
    box-shadow: 0 0 35px rgba(0, 193, 255, .55);
}

.side {
    position: fixed;
    top: 115px;
    bottom: 95px;
    width: min(26vw, 390px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
    z-index: 4;
}

.side.visible {
    opacity: 1;
    pointer-events: auto;
}

.side.left {
    left: 25px;
    transform: translateX(-18px);
}

.side.right {
    right: 25px;
    transform: translateX(18px);
}

.side.visible.left,
.side.visible.right {
    transform: translateX(0);
}

.panel {
    margin-bottom: 15px;
    padding: 17px;
    border: 1px solid rgba(0, 175, 255, .3);
    background: rgba(3, 15, 30, .8);
    border-radius: 13px;
    box-shadow: 0 0 25px rgba(0, 120, 255, .08);
}

.panel-title {
    color: #45d6ff;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.result-title {
    font-size: 15px;
    margin-bottom: 8px;
}

.result-text {
    color: #9ec4d4;
    font-size: 12px;
    line-height: 1.55;
}

.result-link {
    display: inline-block;
    margin-top: 10px;
    color: #3fd8ff;
    text-decoration: none;
    font-size: 11px;
}

.footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid rgba(0, 174, 255, .18);
    background: rgba(2, 7, 18, .75);
    z-index: 20;
}

.footer span {
    color: #3587aa;
    font-size: 10px;
    letter-spacing: 3px;
}

.message {
    position: fixed;
    left: 50%;
    bottom: 103px;
    transform: translateX(-50%);
    width: min(80vw, 700px);
    text-align: center;
    color: #9fdced;
    font-size: 13px;
    line-height: 1.5;
    min-height: 20px;
    z-index: 8;
}

@media (max-width: 850px) {
    .topbar {
        padding: 0 17px;
        height: 75px;
    }

    .brand-name {
        font-size: 20px;
        letter-spacing: 5px;
    }

    .brand-sub {
        display: none;
    }

    .main {
        inset: 75px 0 65px;
    }

    .core {
        width: 245px;
        height: 245px;
    }

    .core.speaking {
        width: 315px;
        height: 315px;
    }

    .core-face {
        width: 178px;
        height: 178px;
    }

    .core-face img {
        width: 60px;
        height: 60px;
    }

    .nexus-title {
        font-size: 19px;
        letter-spacing: 5px;
    }

    .side {
        top: auto;
        bottom: 105px;
        width: calc(100vw - 30px);
        left: 15px !important;
        right: auto !important;
        max-height: 180px;
        overflow-y: auto;
    }

    .side.right {
        display: none;
    }

    .message {
        bottom: 82px;
        font-size: 12px;
    }
}
</style>
</head>

<body>
<script>
(function () {
    const loggedIn = localStorage.getItem("nexusLoggedIn");

    if (loggedIn !== "true") {
        window.location.replace("connexion.html");
    }
})();
</script>

<header class="topbar">
    <div class="brand">
        <img src="nexus-icon-512.png" alt="NEXUS">
        <div>
            <div class="brand-name">NEXUS</div>
            <div class="brand-sub">CONTRÔLE / SYSTÈME / INTELLIGENCE</div>
        </div>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        <span id="systemStatus">SYSTÈME STABLE</span>
    </div>
</header>

<aside class="side left" id="leftSide">
    <div id="leftResults"></div>
</aside>

<main class="main">

    <section class="voice-zone">

        <div class="core" id="core">
            <div class="orbit one"></div>
            <div class="orbit two"></div>
            <div class="orbit three"></div>

            <div class="core-face">
                <img src="nexus-icon-512.png" alt="NEXUS">
                <div class="nexus-title">NEXUS</div>
                <div class="nexus-state" id="nexusState">EN ATTENTE</div>
            </div>
        </div>

        <button class="talk-button" id="talkButton">
            🎙 PARLER À NEXUS
        </button>

    </section>

</main>

<aside class="side right" id="rightSide">
    <div id="rightResults"></div>
</aside>

<div class="message" id="message">
    Prêt. Appuie sur « Parler à NEXUS ».
</div>

<footer class="footer">
    <span>NEXUS / PLUS QU'UN SYSTÈME</span>
</footer>

<script>
const core = document.getElementById("core");
const talkButton = document.getElementById("talkButton");
const nexusState = document.getElementById("nexusState");
const message = document.getElementById("message");
const leftSide = document.getElementById("leftSide");
const rightSide = document.getElementById("rightSide");
const leftResults = document.getElementById("leftResults");
const rightResults = document.getElementById("rightResults");
const systemStatus = document.getElementById("systemStatus");

let recognition = null;
let listening = false;

function setState(state) {
    nexusState.textContent = state;
}

function setMessage(text) {
    message.textContent = text;
}

function startSpeaking() {
    core.classList.add("speaking");
    setState("NEXUS PARLE");
}

function stopSpeaking() {
    core.classList.remove("speaking");
    setState("EN ATTENTE");
}

function speak(text) {
    if (!("speechSynthesis" in window)) {
        setMessage(text);
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "fr-FR";
    utterance.rate = 0.95;
    utterance.pitch = 0.95;

    utterance.onstart = () => {
        startSpeaking();
    };

    utterance.onend = () => {
        stopSpeaking();
    };

    utterance.onerror = () => {
        stopSpeaking();
    };

    window.speechSynthesis.speak(utterance);
}

function showResults(results, query) {
    leftResults.innerHTML = "";
    rightResults.innerHTML = "";

    if (!results.length) {
        leftSide.classList.remove("visible");
        rightSide.classList.remove("visible");
        return;
    }

    results.slice(0, 3).forEach((item, index) => {
        const panel = document.createElement("div");
        panel.className = "panel";

        panel.innerHTML = `
            <div class="panel-title">RÉSULTAT ${index + 1}</div>
            <div class="result-title">${escapeHtml(item.title)}</div>
            <div class="result-text">${escapeHtml(item.snippet)}</div>
            <a class="result-link"
               href="https://fr.wikipedia.org/?curid=${item.pageid}"
               target="_blank"
               rel="noopener noreferrer">
               OUVRIR LA SOURCE →
            </a>
        `;

        if (index % 2 === 0) {
            leftResults.appendChild(panel);
        } else {
            rightResults.appendChild(panel);
        }
    });

    leftSide.classList.add("visible");
    rightSide.classList.add("visible");

    setMessage("Recherche terminée pour : " + query);
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function searchWikipedia(query) {
    setState("RECHERCHE");
    setMessage("NEXUS recherche : " + query);
    systemStatus.textContent = "RECHERCHE EN COURS";

    try {
        const url =
            "https://fr.wikipedia.org/w/api.php" +
            "?action=query" +
            "&list=search" +
            "&srsearch=" + encodeURIComponent(query) +
            "&utf8=1" +
            "&format=json" +
            "&origin=*";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Recherche impossible");
        }

        const data = await response.json();
        const results = data.query?.search || [];

        showResults(results, query);

        systemStatus.textContent = "SYSTÈME STABLE";

        if (!results.length) {
            setState("AUCUN RÉSULTAT");
            speak("Je n'ai trouvé aucun résultat pour " + query);
            setTimeout(() => setState("EN ATTENTE"), 2500);
            return;
        }

        const first = results[0];

        speak(
            "J'ai trouvé " +
            results.length +
            " résultats. Le premier concerne " +
            first.title +
            ". Les résultats sont affichés sur les côtés."
        );

    } catch (error) {
        systemStatus.textContent = "ERREUR RECHERCHE";
        setState("ERREUR");

        leftSide.classList.remove("visible");
        rightSide.classList.remove("visible");

        speak("Je n'arrive pas à effectuer la recherche pour le moment.");

        setTimeout(() => {
            systemStatus.textContent = "SYSTÈME STABLE";
            setState("EN ATTENTE");
        }, 2500);
    }
}

function processCommand(text) {
    const command = text.trim();

    if (!command) {
        speak("Je t'écoute.");
        return;
    }

    const lower = command.toLowerCase();

    if (
        lower.startsWith("recherche ") ||
        lower.startsWith("cherche ") ||
        lower.startsWith("recherches ")
    ) {
        const query = command
            .replace(/^recherche\s+/i, "")
            .replace(/^cherche\s+/i, "")
            .replace(/^recherches\s+/i, "")
            .trim();

        if (query) {
            searchWikipedia(query);
            return;
        }
    }

    if (
        lower.includes("bonjour") ||
        lower.includes("salut")
    ) {
        speak("Bonjour. NEXUS est prêt.");
        return;
    }

    if (
        lower.includes("qui es-tu") ||
        lower.includes("qui est nexus")
    ) {
        speak(
            "Je suis NEXUS, ton interface intelligente. " +
            "Je peux répondre à tes commandes et effectuer des recherches."
        );
        return;
    }

    if (
        lower.includes("merci")
    ) {
        speak("Avec plaisir.");
        return;
    }

    speak(
        "J'ai compris : " +
        command +
        ". Pour effectuer une recherche, dis par exemple : recherche intelligence artificielle."
    );
}

function initRecognition() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        return false;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        listening = true;
        talkButton.classList.add("active");
        talkButton.textContent = "🎙 J'ÉCOUTE...";
        setState("ÉCOUTE");
        setMessage("NEXUS t'écoute...");
    };

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        setMessage("Tu as dit : " + text);
        processCommand(text);
    };

    recognition.onerror = (event) => {
        listening = false;
        talkButton.classList.remove("active");
        talkButton.textContent = "🎙 PARLER À NEXUS";

        if (event.error === "not-allowed") {
            setState("MICRO REFUSÉ");
            speak("L'accès au microphone a été refusé.");
        } else {
            setState("ERREUR MICRO");
            speak("Je n'ai pas réussi à comprendre.");
        }

        setTimeout(() => setState("EN ATTENTE"), 2500);
    };

    recognition.onend = () => {
        listening = false;
        talkButton.classList.remove("active");
        talkButton.textContent = "🎙 PARLER À NEXUS";

        if (!core.classList.contains("speaking")) {
            setState("EN ATTENTE");
        }
    };

    return true;
}

const recognitionAvailable = initRecognition();

talkButton.addEventListener("click", () => {

    if (listening) {
        recognition?.stop();
        return;
    }

    if (!recognitionAvailable) {
        speak(
            "La reconnaissance vocale n'est pas disponible dans ce navigateur. " +
            "Utilise Chrome ou Edge pour parler à NEXUS."
        );
        return;
    }

    leftSide.classList.remove("visible");
    rightSide.classList.remove("visible");

    try {
        recognition.start();
    } catch (error) {
        console.log(error);
    }
});

window.addEventListener("beforeunload", () => {
    window.speechSynthesis?.cancel();
});
</script>

</body>
</html>
