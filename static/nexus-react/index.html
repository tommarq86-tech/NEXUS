<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020712">
<meta name="description" content="NEXUS - assistant intelligent">
<link rel="icon" type="image/png" href="./nexus-icon-512.png">
<title>NEXUS</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020712;
    color: #dff7ff;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 50%, rgba(0,120,255,.12), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(0,210,255,.06), transparent 55%),
        #020712;
}

/* =========================================================
   ECRAN INITIAL
   ========================================================= */

50% { transform: translateY(-7px); }
}

/* =========================================================
   INTERFACE NEXUS
   ========================================================= */

#nexusInterface {
    position: fixed;
    inset: 0;
    display: none;
    opacity: 0;
    transition: opacity .7s ease;
}

#nexusInterface.active {
    display: block;
}

#nexusInterface.visible {
    opacity: 1;
}

/* Barre supérieure */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid rgba(90,180,255,.08);
    background: rgba(2,7,18,.45);
    backdrop-filter: blur(12px);
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.brand img {
    width: 35px;
    height: 35px;
    object-fit: contain;
}

.brand-name {
    font-weight: 800;
    letter-spacing: .16em;
}

.brand-state {
    color: #50d5ff;
    font-size: 10px;
    letter-spacing: .15em;
}

.back-button {
    border: 1px solid rgba(120,190,220,.18);
    background: rgba(255,255,255,.025);
    color: #88a7b8;
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
}

.back-button:hover {
    color: white;
    border-color: rgba(100,210,255,.4);
}

/* Zone centrale */

.center {
    position: absolute;
    inset: 72px 0 90px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.core-zone {
    position: relative;
    width: 520px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.core {
    position: relative;
    width: 235px;
    height: 235px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 45%,
            rgba(50,190,255,.20),
            rgba(0,45,100,.22) 48%,
            rgba(0,10,25,.88) 72%);
    border: 1px solid rgba(65,205,255,.48);
    box-shadow:
        0 0 25px rgba(0,150,255,.25),
        0 0 80px rgba(0,100,255,.12),
        inset 0 0 45px rgba(0,170,255,.12);
    transition:
        width .7s cubic-bezier(.2,.8,.2,1),
        height .7s cubic-bezier(.2,.8,.2,1),
        box-shadow .5s ease;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(50,190,255,.14);
}

.core::before {
    inset: -25px;
}

.core::after {
    inset: -50px;
    border-color: rgba(50,160,255,.07);
}

.core-logo {
    width: 112px;
    height: 112px;
    object-fit: contain;
    filter:
        drop-shadow(0 0 15px rgba(0,200,255,.65))
        drop-shadow(0 0 35px rgba(0,100,255,.35));
}

.core.listening {
    width: 290px;
    height: 290px;
    box-shadow:
        0 0 35px rgba(0,190,255,.38),
        0 0 110px rgba(0,120,255,.2),
        inset 0 0 60px rgba(0,190,255,.16);
    animation: listenPulse 1.6s ease-in-out infinite;
}

.core.speaking {
    width: 360px;
    height: 360px;
    box-shadow:
        0 0 50px rgba(0,210,255,.5),
        0 0 150px rgba(0,120,255,.25),
        inset 0 0 75px rgba(0,210,255,.2);
    animation: speakPulse .7s ease-in-out infinite alternate;
}

@keyframes listenPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.035); }
}

@keyframes speakPulse {
    from { transform: scale(.97); }
    to { transform: scale(1.04); }
}

/* Bouton parler */

/* =========================================================
   RESULTATS
   ========================================================= */

.results {
    position: absolute;
    top: 100px;
    bottom: 110px;
    width: 31%;
    overflow-y: auto;
    display: none;
    z-index: 5;
}

.results.visible {
    display: block;
}

.results.left {
    left: 24px;
}

.results.right {
    right: 24px;
}

.result-card {
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid rgba(80,190,255,.14);
    border-radius: 13px;
    background: rgba(5,18,34,.68);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,100,200,.06);
}

.result-card h3 {
    margin: 0 0 8px;
    color: #75dcff;
    font-size: 15px;
}

.result-card p {
    margin: 0;
    color: #91aab9;
    font-size: 13px;
    line-height: 1.55;
}

.result-card a {
    display: inline-block;
    margin-top: 10px;
    color: #4dd6ff;
    font-size: 12px;
    text-decoration: none;
}

/* =========================================================
   STATUS BAS
   ========================================================= */

.bottom-status {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #587587;
    font-size: 11px;
    letter-spacing: .14em;
}

.bottom-status strong {
    color: #53d7ff;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {
    .results {
        width: 42%;
    }

    .core {
        width: 200px;
        height: 200px;
    }

    .core.listening {
        width: 255px;
        height: 255px;
    }

    .core.speaking {
        width: 300px;
        height: 300px;
    }
}

@media (max-width: 650px) {
    .home-title {
        font-size: 34px;
    }

    .home-subtitle {
        font-size: 10px;
    }

    .results {
        width: calc(100% - 24px);
        left: 12px !important;
        right: 12px !important;
        top: auto;
        bottom: 105px;
        max-height: 28vh;
    }

    .results.right {
        display: none !important;
    }

    .core-zone {
        transform: scale(.82);
    }
}
</style>

<style id="nexus-direct-interface">
#nexusInterface {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
}
</style>
</head>

<body>

<!-- ========================================================
     ECRAN D'ACCUEIL
     ======================================================== -->

<section id="homeScreen">

    <img
        class="home-logo"
        src="./nexus-icon-512.png"
        alt="NEXUS"
    >

    <h1 class="home-title">NEXUS</h1>

    <div class="home-subtitle">
        CONTRÔLE / SYSTÈME / INTELLIGENCE
    </div>

    <div class="home-status">
        ● SYSTÈME STABLE
    </div>

        🎙 
    </button>

    <div class="home-hint">
        Prêt. Appuie sur «  ».
    </div>

</section>


<!-- ========================================================
     INTERFACE COMPLETE
     ======================================================== -->

<section id="nexusInterface">

    <header class="topbar">

        <div class="brand">

            <img
                src="./nexus-icon-512.png"
                alt="NEXUS"
            >

            <div>
                <div class="brand-name">NEXUS</div>
                <div class="brand-state" id="systemState">
                    EN ATTENTE
                </div>
            </div>

        </div>

        <button id="backButton" class="back-button">
            ← Accueil
        </button>

    </header>


    <!-- RESULTATS GAUCHE -->

    <aside id="leftResults" class="results left"></aside>


    <!-- RESULTATS DROITE -->

    <aside id="rightResults" class="results right"></aside>


    <!-- CENTRE -->

    <main class="center">

        <div class="core-zone">

            <div id="core" class="core">

                <img
                    class="core-logo"
                    src="./nexus-icon-512.png"
                    alt="NEXUS"
                >

            </div>

            

        </div>

    </main>


    <div class="bottom-status">
        NEXUS / <strong>PLUS QU'UN SYSTÈME</strong>
    </div>

</section>


<script>
/* ============================================================
   AUTHENTIFICATION
   ============================================================ */

if (localStorage.getItem("nexusLoggedIn") !== "true") {
    window.location.replace("connexion.html");
}


/* ============================================================
   ELEMENTS
   ============================================================ */


const nexusInterface = document.getElementById("nexusInterface");


const backButton = document.getElementById("backButton");
const core = document.getElementById("core");
const systemState = document.getElementById("systemState");
const leftResults = document.getElementById("leftResults");
const rightResults = document.getElementById("rightResults");

let recognition = null;
let listening = false;


/* ============================================================
   OUVERTURE DE L'INTERFACE
   ============================================================ */

function openNexus() {

    homeScreen.classList.add("hidden");

    setTimeout(() => {

        homeScreen.style.display = "none";

        nexusInterface.classList.add("active");

        requestAnimationFrame(() => {
            nexusInterface.classList.add("visible");
        });

        systemState.textContent = "SYSTÈME PRÊT";

        speak(
            "NEXUS est prêt. Je t'écoute."
        );

    }, 650);
}


/* ============================================================
   RETOUR ACCUEIL
   ============================================================ */

function goHome() {

    stopListening();

    window.speechSynthesis.cancel();

    nexusInterface.classList.remove("visible");

    setTimeout(() => {

        nexusInterface.classList.remove("active");

        homeScreen.style.display = "flex";

        requestAnimationFrame(() => {
            homeScreen.classList.remove("hidden");
        });

        core.classList.remove("listening");
        core.classList.remove("speaking");

        systemState.textContent = "EN ATTENTE";

    }, 600);
}


/* ============================================================
   VOIX NEXUS
   ============================================================ */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "fr-FR";
    utterance.rate = 1;
    utterance.pitch = 1;

    core.classList.add("speaking");
    systemState.textContent = "NEXUS PARLE";

    utterance.onend = () => {

        core.classList.remove("speaking");

        if (!listening) {
            systemState.textContent = "SYSTÈME PRÊT";
        }

    };

    utterance.onerror = () => {

        core.classList.remove("speaking");
        systemState.textContent = "SYSTÈME PRÊT";

    };

    window.speechSynthesis.speak(utterance);
}


/* ============================================================
   RECONNAISSANCE VOCALE
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "fr-FR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {

        listening = true;

        core.classList.add("listening");

        systemState.textContent = "ÉCOUTE EN COURS";


    };

    recognition.onresult = async (event) => {

        const text =
            event.results[0][0].transcript.trim();

        listening = false;

        core.classList.remove("listening");


        await processCommand(text);

    };

    recognition.onerror = () => {

        listening = false;

        core.classList.remove("listening");


        systemState.textContent = "SYSTÈME PRÊT";

    };

    recognition.onend = () => {

        listening = false;

        core.classList.remove("listening");


    };

}


/* ============================================================
   ECOUTER
   ============================================================ */

function startListening() {

    if (!recognition) {

        speak(
            "La reconnaissance vocale n'est pas disponible dans ce navigateur."
        );

        return;
    }

    try {

        window.speechSynthesis.cancel();

        recognition.start();

    } catch (error) {

        console.log(error);

    }

}


/* ============================================================
   ARRETER
   ============================================================ */

function stopListening() {

    if (!recognition) {
        return;
    }

    try {
        recognition.stop();
    } catch (error) {
        console.log(error);
    }

    listening = false;

    core.classList.remove("listening");


}


/* ============================================================
   BOUTONS
   ============================================================ */

    "click",
    openNexus
);

    "click",
    () => {

        if (listening) {
            stopListening();
        } else {
            startListening();
        }

    }
);

backButton.addEventListener(
    "click",
    goHome
);


/* ============================================================
   RECHERCHE WIKIPEDIA
   ============================================================ */

async function searchWikipedia(query) {

    const url =
        "https://fr.wikipedia.org/w/api.php" +
        "?action=query" +
        "&generator=search" +
        "&gsrsearch=" + encodeURIComponent(query) +
        "&gsrlimit=4" +
        "&prop=extracts|info" +
        "&exintro=1" +
        "&explaintext=1" +
        "&inprop=url" +
        "&format=json" +
        "&origin=*";

    try {

        const response = await fetch(url);

        const data = await response.json();

        const pages = data.query && data.query.pages
            ? Object.values(data.query.pages)
            : [];

        return pages;

    } catch (error) {

        console.error(error);

        return [];

    }

}


/* ============================================================
   AFFICHAGE DES RESULTATS
   ============================================================ */

function clearResults() {

    leftResults.innerHTML = "";
    rightResults.innerHTML = "";

    leftResults.classList.remove("visible");
    rightResults.classList.remove("visible");

}


function showResults(results) {

    clearResults();

    if (!results.length) {
        return;
    }

    results.forEach((result, index) => {

        const card = document.createElement("article");

        card.className = "result-card";

        const title =
            result.title || "Résultat";

        const extract =
            result.extract ||
            "Aucune description disponible.";

        const link =
            result.fullurl ||
            "#";

        card.innerHTML = `
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(extract)}</p>
            <a href="${link}" target="_blank" rel="noopener">
                Ouvrir la source →
            </a>
        `;

        if (index % 2 === 0) {
            leftResults.appendChild(card);
        } else {
            rightResults.appendChild(card);
        }

    });

    leftResults.classList.add("visible");

    if (results.length > 1) {
        rightResults.classList.add("visible");
    }

}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   TRAITEMENT DES COMMANDES
   ============================================================ */

async function processCommand(command) {

    const text = command.toLowerCase().trim();

    systemState.textContent = "ANALYSE EN COURS";

    /* Bonjour */

    if (
        text.includes("bonjour") ||
        text.includes("salut") ||
        text.includes("hello")
    ) {

        speak(
            "Bonjour. Je suis NEXUS. Que puis-je faire pour toi ?"
        );

        return;
    }


    /* Identité */

    if (
        text.includes("qui es-tu") ||
        text.includes("qui es tu") ||
        text.includes("présente-toi") ||
        text.includes("presente toi")
    ) {

        speak(
            "Je suis NEXUS, ton assistant intelligent."
        );

        return;
    }


    /* Merci */

    if (
        text.includes("merci")
    ) {

        speak(
            "Avec plaisir."
        );

        return;
    }


    /* Recherche */

    let query = "";

    if (text.startsWith("recherche ")) {

        query = command.substring(10).trim();

    } else if (text.startsWith("cherche ")) {

        query = command.substring(8).trim();

    } else if (text.startsWith("trouve ")) {

        query = command.substring(7).trim();

    }


    if (query) {

        clearResults();

        systemState.textContent = "RECHERCHE EN COURS";

        const results =
            await searchWikipedia(query);

        showResults(results);

        if (results.length) {

            const first = results[0];

            const summary =
                first.extract
                    ? first.extract.substring(0, 420)
                    : "J'ai trouvé plusieurs résultats.";

            speak(
                "J'ai trouvé des informations sur " +
                query +
                ". " +
                summary
            );

        } else {

            speak(
                "Je n'ai trouvé aucun résultat pour " +
                query +
                "."
            );

        }

        return;
    }


    /* Commande recherche naturelle */

    if (
        text.includes("recherche") ||
        text.includes("cherche") ||
        text.includes("informations sur")
    ) {

        const cleaned = command
            .replace(/recherche/gi, "")
            .replace(/cherche/gi, "")
            .replace(/informations sur/gi, "")
            .trim();

        if (cleaned) {

            const results =
                await searchWikipedia(cleaned);

            showResults(results);

            if (results.length) {

                speak(
                    "Voici ce que j'ai trouvé sur " +
                    cleaned +
                    "."
                );

            } else {

                speak(
                    "Je n'ai rien trouvé sur " +
                    cleaned +
                    "."
                );

            }

            return;
        }
    }


    /* Commande inconnue */

    speak(
        "J'ai bien reçu ta demande : " +
        command +
        ". Pour effectuer une recherche, dis par exemple recherche espace France."
    );

}


/* ============================================================
   ENTREE CLAVIER
   ============================================================ */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.code === "Space" &&
            nexusInterface.classList.contains("visible") &&
            document.activeElement.tagName !== "BUTTON"
        ) {

            event.preventDefault();

            if (listening) {
                stopListening();
            } else {
                startListening();
            }

        }

        if (event.key === "Escape") {

            if (
                nexusInterface.classList.contains("visible")
            ) {

                goHome();

            }

        }

    }
);
</script>


<script id="nexus-direct-interface-script">
document.addEventListener("DOMContentLoaded", function () {
    var nexusInterface = document.getElementById("nexusInterface");

    if (nexusInterface) {
        nexusInterface.classList.add("active");
        nexusInterface.classList.add("visible");
        nexusInterface.style.display = "block";
        nexusInterface.style.opacity = "1";
        nexusInterface.style.visibility = "visible";
    }

    var homeScreen = document.getElementById("homeScreen");

    if (homeScreen) {
        homeScreen.remove();
    }

    document.querySelectorAll(
        ".talk-button, ., .voice-button, .home-hint"
    ).forEach(function (element) {
        element.remove();
    });
});
</script>
</body>
</html>
