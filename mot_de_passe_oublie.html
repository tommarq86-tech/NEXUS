<!DOCTYPE html>

<body>

<header>

<main>
    <h1>Mot de passe oublié</h1>

    <p>Entre ton adresse e-mail pour demander une réinitialisation.</p>

    <form onsubmit="event.preventDefault(); alert('La récupération de compte sera disponible prochainement.');">

        <input id="email" type="email" required>

        <button type="submit">Continuer</button>
    </form>
