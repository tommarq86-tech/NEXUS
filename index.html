  <body>
    <div id="root"></div>
  <script id="nexus-console-bridge">
(function () {
    function connectNexus() {
        var elements = document.querySelectorAll("a, button");

        for (var i = 0; i < elements.length; i++) {
            var element = elements[i];
            var label = (element.textContent || "").replace(/\s+/g, " ").trim();

            if (
                label.indexOf("Accéder à NEXUS") !== -1 ||
                label.indexOf("Accès à NEXUS") !== -1 ||
                label.indexOf("Acces a NEXUS") !== -1
            ) {
                element.setAttribute("href", "/NEXUS/console/");
            }
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", connectNexus);
    } else {
        connectNexus();
    }
})();
</script>
